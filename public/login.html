<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer — Sign in</title>
<style>
:root{--bg:#0b0d12;--card:#141824;--line:#262c3d;--text:#e8ebf3;--dim:#8b93a8;--accent:#4f8cff}
@media (prefers-color-scheme: light){:root{--bg:#f3f5fa;--card:#fff;--line:#d9deea;--text:#12151f;--dim:#5b6479}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;padding:16px}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--dim)}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6}
.link{background:none;color:var(--accent);width:auto;margin:14px 0 0;padding:0;font-weight:400}
#err{color:#ff6b6b;min-height:20px;margin-top:12px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1 id="h">Sign in to Observer</h1>
  <p id="sub">Use your agency account.</p>
  <form id="f">
    <div id="agencyRow" class="hide"><label for="agency">Agency name</label><input id="agency" type="text" autocomplete="organization" maxlength="100"></div>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="10" required>
    <div id="seedRow" class="row hide"><input id="seed" type="checkbox" checked><label for="seed" style="margin:0">Start with demo leads</label></div>
    <div id="err" role="alert"></div>
    <button id="go">Sign in</button>
  </form>
  <button class="link" id="toggle" type="button">New agency? Create an account</button>
</main>
<script>
let signup = false;
const $ = id => document.getElementById(id);
function mode(s) {
  signup = s;
  $('h').textContent = s ? 'Create your agency' : 'Sign in to Observer';
  $('sub').textContent = s ? 'You become the admin. Password: 10+ characters.' : 'Use your agency account.';
  $('go').textContent = s ? 'Create account' : 'Sign in';
  $('toggle').textContent = s ? 'Have an account? Sign in' : 'New agency? Create an account';
  $('agencyRow').classList.toggle('hide', !s); $('seedRow').classList.toggle('hide', !s);
  $('pw').autocomplete = s ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
$('toggle').onclick = () => mode(!signup);
$('f').onsubmit = async e => {
  e.preventDefault(); $('go').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch('/api/auth/' + (signup ? 'signup' : 'login'), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('pw').value, agency: $('agency').value, seed_demo: $('seed').checked }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong');
    location.href = '/platform.html';
  } catch (er) { $('err').textContent = er.message; $('go').disabled = false; }
};
</script>
</body>
</html>
