<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio &amp; Investor Operations — concept prototype</title>
<meta name="description" content="Concept prototype with fictional sample data: real-estate portfolio and investor operations.">
<style>
/* Concept prototype styles. No external fonts or images: system fonts only, so the page makes no network requests. */
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f6;--text:#18202d;--muted:#566174;--border:#dde1e8;--border-strong:#c3cad6;
  --accent:#0f5c63;--accent-ink:#fff;--accent-soft:#e3f1f2;
  --good:#1b7444;--good-bg:#e5f4ec;--warn:#8a5200;--warn-bg:#fff2dc;--bad:#b02a22;--bad-bg:#fde8e6;--info:#1f4a9c;--info-bg:#e7eefb;
  --investor:#3d3a8c;--investor-soft:#ecebfa;--banner:#2a2f3a;--banner-ink:#f3f4f7;
  --shadow:0 1px 2px rgba(20,28,40,.06),0 4px 14px rgba(20,28,40,.05);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans Arabic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e131a;--surface:#161d27;--surface2:#1d2633;--text:#e7ebf1;--muted:#9eaabb;--border:#2a3443;--border-strong:#3a4658;
  --accent:#5fc4cd;--accent-ink:#06292c;--accent-soft:#143a3f;
  --good:#5fd08f;--good-bg:#12301f;--warn:#f0b659;--warn-bg:#36280e;--bad:#ff8f86;--bad-bg:#3b1815;--info:#8cb4ff;--info-bg:#15264a;
  --investor:#a9a6ff;--investor-soft:#24234a;--banner:#05080c;--banner-ink:#e7ebf1;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}}
:root[data-theme=dark]{
  --bg:#0e131a;--surface:#161d27;--surface2:#1d2633;--text:#e7ebf1;--muted:#9eaabb;--border:#2a3443;--border-strong:#3a4658;
  --accent:#5fc4cd;--accent-ink:#06292c;--accent-soft:#143a3f;
  --good:#5fd08f;--good-bg:#12301f;--warn:#f0b659;--warn-bg:#36280e;--bad:#ff8f86;--bad-bg:#3b1815;--info:#8cb4ff;--info-bg:#15264a;
  --investor:#a9a6ff;--investor-soft:#24234a;--banner:#05080c;--banner-ink:#e7ebf1;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font)}
h1,h2,h3{margin:0;line-height:1.25;font-weight:650}
h1{font-size:20px}h2{font-size:15px}h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
p{margin:0}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}

/* Persistent prototype banner */
.proto-banner{background:var(--banner);color:var(--banner-ink);padding:7px 16px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.proto-banner strong{background:#f5b84a;color:#2b1d00;padding:1px 8px;border-radius:99px;font-size:11.5px;white-space:nowrap}
.proto-banner a{color:inherit;margin-inline-start:auto;text-decoration:underline;font-size:12px}

/* Layout */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 36px)}
.side{background:var(--surface);border-inline-end:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:36px;align-self:start;height:calc(100vh - 36px);overflow:auto}
.brand{padding:4px 10px 14px}
.brand b{display:block;font-size:15px}.brand span{font-size:12px;color:var(--muted)}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav a .count{margin-inline-start:auto;font-size:11.5px;background:var(--bad-bg);color:var(--bad);border-radius:99px;padding:0 7px;font-weight:650}
.side .sep{height:1px;background:var(--border);margin:10px 4px}
.side .opt{font-size:12.5px;color:var(--muted);padding:6px 10px}
.side .opt a{display:block;margin-top:4px}
.main{padding:20px 24px 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=search],input[type=number],textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:70px}
.btn{font:inherit;font-weight:600;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;min-height:36px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:30px;padding:3px 10px;font-size:12.5px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{font:inherit;background:var(--surface);color:var(--text);border:0;padding:6px 11px;cursor:pointer;min-height:34px}
.seg button+button{border-inline-start:1px solid var(--border-strong)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:650}

/* Cards, grids, tables */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cols2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols2e{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.kpi .label{font-size:12.5px;color:var(--muted)}
.kpi .value{font-size:24px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .note{font-size:12px;color:var(--muted)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface2)}
td.num,th.num{text-align:end}
tr.click{cursor:pointer}tr.click:hover{background:var(--surface2)}
caption{text-align:start;font-weight:650;padding:0 0 8px;color:var(--text)}
.pill{display:inline-block;font-size:11.5px;font-weight:650;border-radius:99px;padding:1px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.neutral{background:var(--surface2);color:var(--muted)}
.tag-sample{font-size:11px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:6px;padding:0 6px;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.list li:last-child{border-bottom:0}
.list .t{font-weight:600}.list .d{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:10px}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid}
.notice.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.notice.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.dl dt{color:var(--muted);font-size:12.5px}.dl dd{margin:0;font-weight:500}
details.method{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface2)}
details.method summary{cursor:pointer;font-weight:650}
code,.mono{font-family:var(--mono);font-size:12.5px}
.formula{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin:6px 0;display:block}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:max-content;max-width:90vw;background:var(--banner);color:var(--banner-ink);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:80}
.toast.bad{background:var(--bad);color:#fff}
dialog{border:1px solid var(--border-strong);border-radius:14px;background:var(--surface);color:var(--text);padding:0;max-width:min(640px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
dialog .db{padding:16px 18px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Investor workspace: visibly different chrome */
body.investor-mode .side{background:var(--investor-soft)}
body.investor-mode .nav a[aria-current=page]{background:var(--investor);color:#fff}
.inv-band{background:var(--investor);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inv-band strong{background:#fff;color:var(--investor);border-radius:99px;padding:1px 10px;font-size:12px}
.inv-band span{font-size:13px}
.demo-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;background:rgba(255,255,255,.14);border-radius:8px;padding:4px 8px}
.demo-ctrl select{min-height:30px;padding:3px 8px}
.ops-band{border:1px dashed var(--border-strong);border-radius:12px;padding:8px 14px;margin-bottom:14px;color:var(--muted);font-size:12.5px}

/* Assistant */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip:hover{background:var(--surface2)}
.answer{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface);margin-top:12px}
.answer .q{font-weight:650;margin-bottom:8px}
.answer ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
.answer .kind{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-inline-end:6px}
.answer .kind.fact{background:var(--good-bg);color:var(--good)}.answer .kind.inference{background:var(--warn-bg);color:var(--warn)}
.answer .srcs{margin-top:10px;font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Responsive */
@media (max-width:1000px){.cols2{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-inline-end:0;border-bottom:1px solid var(--border);padding:8px 10px}
  .brand{padding:2px 8px}.side .sep,.side .opt{display:none}
  .nav{display:flex;gap:2px;overflow-x:auto;flex:1}
  .nav a{white-space:nowrap;padding:8px 10px}
  .main{padding:14px 14px 40px}
}
@media print{.side,.proto-banner .nav,.ctrls,.btn{display:none!important}}

</style>

<script>
/* Pure calculations. No DOM, no network, no randomness. Every figure shown in the UI comes from these functions,
   from the visible inputs in data.js. Formulas are repeated in the UI "Methodology" panels.
   Definitions (sample methodology, not an accounting standard):
     rental income   = gross potential rent x occupancy (rounded to a whole unit)
     total income    = rental income + other income
     opex            = sum of operating cost lines + one-off costs in that month (excludes capex, debt service, tax on income)
     NOI             = total income - opex
     annualised NOI  = period NOI x 12 / months in period
     yield on cost   = annualised NOI / acquisition cost
     yield on value  = annualised NOI / current valuation (n/a when no valuation is on file)
     rent-weighted occupancy = sum(gross potential rent x occupancy) / sum(gross potential rent)  */
(function (root) {
  const C = {};
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const day = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  C.daysBetween = (fromIso, toIso) => Math.round((day(toIso) - day(fromIso)) / 864e5);
  C.period = (D, id) => D.periods.find(p => p.id === id);
  C.targetFor = (D, asset) => asset.targetYield ?? D.config.targetYield;
  C.opexLines = a => Object.values(a.opex).reduce((s, v) => s + v, 0);

  C.assetMonth = (D, a, m) => {
    const i = D.months.indexOf(m), occ = a.occ[i];
    const rental = Math.round(a.gpr * occ), other = a.other, income = rental + other;
    const opex = C.opexLines(a) + (a.oneOff[i] || 0);
    return { month: m, occ, gpr: a.gpr, rental, other, income, opex, noi: income - opex };
  };
  C.assetPeriod = (D, a, periodId) => {
    const p = C.period(D, periodId), rows = p.months.map(m => C.assetMonth(D, a, m));
    const income = sum(rows, r => r.income), opex = sum(rows, r => r.opex), noi = income - opex, factor = 12 / rows.length;
    return {
      assetId: a.id, periodId, months: rows.length, rows, income, opex, noi, annualNoi: noi * factor,
      occupancy: sum(rows, r => r.occ) / rows.length,
      yieldOnCost: (noi * factor) / a.cost,
      yieldOnValue: a.valuation ? (noi * factor) / a.valuation.value : null,
      target: C.targetFor(D, a),
    };
  };
  C.portfolioPeriod = (D, assets, periodId) => {
    const per = assets.map(a => C.assetPeriod(D, a, periodId));
    const income = sum(per, r => r.income), opex = sum(per, r => r.opex), noi = income - opex, factor = 12 / (per[0]?.months || 1);
    const cost = sum(assets, a => a.cost), valued = assets.filter(a => a.valuation);
    const gprTotal = sum(assets, a => a.gpr);
    return {
      periodId, assets: per, income, opex, noi, annualNoi: noi * factor, cost,
      value: sum(valued, a => a.valuation.value), valuedCount: valued.length, assetCount: assets.length,
      costOfValued: sum(valued, a => a.cost),
      occupancy: gprTotal ? sum(assets, (a, i) => a.gpr * per[assets.indexOf(a)].occupancy) / gprTotal : 0,
      yieldOnCost: cost ? (noi * factor) / cost : 0,
    };
  };
  // Variance of a figure vs the prior period; null when there is no comparable prior period.
  C.vsPrior = (D, assets, periodId) => {
    const p = C.period(D, periodId);
    if (!p.prior) return null;
    const cur = C.portfolioPeriod(D, assets, periodId), prev = C.portfolioPeriod(D, assets, p.prior);
    return { prior: p.prior, noiDelta: cur.noi - prev.noi, noiPct: prev.noi ? (cur.noi - prev.noi) / Math.abs(prev.noi) : null, incomeDelta: cur.income - prev.income, opexDelta: cur.opex - prev.opex, occDelta: cur.occupancy - prev.occupancy };
  };
  C.monthlyNoiSeries = (D, assets) => D.months.map(m => ({ month: m, noi: sum(assets, a => C.assetMonth(D, a, m).noi), income: sum(assets, a => C.assetMonth(D, a, m).income) }));

  // ── Exceptions: transparent rules, no scoring model. Each carries the rule and the evidence used. ──
  C.exceptions = (D, periodId) => {
    const T = D.config.thresholds, today = D.config.demoToday, out = [], sev = { high: 0, medium: 1, low: 2 };
    const push = (e) => out.push(e);
    const latest = D.months[D.months.length - 1];
    D.assets.forEach(a => {
      if (!a.valuation) push({ id: 'val-missing-' + a.id, severity: 'high', type: 'Missing data', assetId: a.id, title: `${a.name}: no valuation on file`, detail: 'Yield on value cannot be calculated. Portfolio value excludes this asset.', rule: 'Asset has no valuation record', evidence: [`asset ${a.id}`] });
      else {
        const age = C.daysBetween(a.valuation.date, today);
        if (age > T.valuationMaxAgeDays) push({ id: 'val-stale-' + a.id, severity: 'medium', type: 'Stale data', assetId: a.id, title: `${a.name}: valuation is ${age} days old`, detail: `Valuation dated ${a.valuation.date} (${a.valuation.source}).`, rule: `Valuation older than ${T.valuationMaxAgeDays} days at ${today}`, evidence: [`asset ${a.id} valuation date ${a.valuation.date}`] });
      }
      const m = C.assetMonth(D, a, latest);
      if (m.occ < T.occupancyMin) push({ id: 'occ-' + a.id, severity: a.status === 'Stabilised' ? 'medium' : 'low', type: 'Performance', assetId: a.id, title: `${a.name}: occupancy ${(m.occ * 100).toFixed(0)}% in the latest month`, detail: a.status === 'Stabilised' ? 'Below the configured occupancy threshold for a stabilised asset.' : `Status is ${a.status}; threshold shown for reference.`, rule: `Latest-month occupancy below ${(T.occupancyMin * 100).toFixed(0)}%`, evidence: [`asset ${a.id} ${latest} occupancy`] });
      const per = C.assetPeriod(D, a, periodId);
      if (per.target - per.yieldOnCost > T.yieldShortfall) push({ id: 'yield-' + a.id, severity: 'medium', type: 'Performance', assetId: a.id, title: `${a.name}: yield on cost ${(per.yieldOnCost * 100).toFixed(2)}% vs target ${(per.target * 100).toFixed(2)}%`, detail: `For the selected period (${periodId}), annualised.`, rule: `Yield on cost below target by more than ${(T.yieldShortfall * 100).toFixed(1)} percentage points`, evidence: [`asset ${a.id} NOI ${periodId}`] });
    });
    D.leases.forEach(l => {
      const d = C.daysBetween(today, l.end);
      if (d >= 0 && d <= T.leaseExpiryDays) push({ id: 'lease-' + l.assetId + '-' + l.end, severity: l.note === 'Anchor tenant' ? 'high' : 'medium', type: 'Lease event', assetId: l.assetId, title: `${D.assets.find(a => a.id === l.assetId).name}: lease expiry in ${d} days`, detail: `${l.tenant}, ${l.space}, ends ${l.end}.`, rule: `Lease ends within ${T.leaseExpiryDays} days of ${today}`, evidence: [`lease ${l.tenant}`] });
    });
    D.documents.filter(d => d.scope === 'asset').forEach(d => {
      const a = D.assets.find(x => x.id === d.ref);
      if (d.status === 'Expired') push({ id: 'doc-exp-' + d.id, severity: 'high', type: 'Record', assetId: d.ref, title: `${a.name}: ${d.type} expired`, detail: `${d.name}, expired ${d.expires}.`, rule: 'Document status Expired', evidence: [`document ${d.id}`] });
      else if (d.expires) { const left = C.daysBetween(today, d.expires); if (left >= 0 && left <= T.docExpiryDays) push({ id: 'doc-soon-' + d.id, severity: 'medium', type: 'Record', assetId: d.ref, title: `${a.name}: ${d.type} expires in ${left} days`, detail: `${d.name}, expires ${d.expires}.`, rule: `Document expires within ${T.docExpiryDays} days`, evidence: [`document ${d.id}`] }); }
      if (d.status === 'Pending review') push({ id: 'doc-rev-' + d.id, severity: 'low', type: 'Approval', assetId: d.ref, title: `${a.name}: ${d.type} awaiting review`, detail: `${d.name}; owner ${d.owner}, due ${d.due}.`, rule: 'Document status Pending review', evidence: [`document ${d.id}`] });
    });
    return out.sort((x, y) => sev[x.severity] - sev[y.severity] || x.id.localeCompare(y.id));
  };

  // ── Investor share of a period (pro-rata of asset figures by ownership %; sample methodology) ──
  C.investorPeriod = (D, inv, periodId) => {
    const rows = Object.entries(inv.holdings).map(([id, share]) => {
      const a = D.assets.find(x => x.id === id), p = C.assetPeriod(D, a, periodId);
      return { assetId: id, name: a.name, share, income: Math.round(p.income * share), opex: Math.round(p.opex * share), noi: Math.round(p.noi * share), valueShare: a.valuation ? Math.round(a.valuation.value * share) : null, valuationDate: a.valuation?.date || null, valuationSource: a.valuation?.source || null, costShare: Math.round(a.cost * share) };
    });
    return { investorId: inv.id, periodId, rows, income: sum(rows, r => r.income), opex: sum(rows, r => r.opex), noi: sum(rows, r => r.noi), valueShare: sum(rows.filter(r => r.valueShare != null), r => r.valueShare), missingValuation: rows.filter(r => r.valueShare == null).map(r => r.name), costShare: sum(rows, r => r.costShare) };
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = C; else root.DemoCalc = C;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Data-access boundary. The UI talks ONLY to this file (all methods return Promises, like a future HTTP client would).
   Today it reads the local sample data in data.js and keeps changes in memory (lost on reload; nothing is persisted).
   To connect a real backend, replace the bodies here; views and calc.js do not need to change.
   Investor filtering below is a visual demonstration only: real access control must be enforced on a server. */
(function (root) {
  const D0 = root.DemoData, C = root.DemoCalc;
  const clone = x => JSON.parse(JSON.stringify(x));
  let D, nextId;
  const reset = () => {
    D = clone(D0); nextId = 1000;
    // Sample published statements get a snapshot generated from the sample data (a real system would store what was approved).
    D.statements.forEach(s => { if (s.status === 'Published' && !s.snapshot) { s.snapshot = C.investorPeriod(D, D.investors.find(i => i.id === s.investorId), s.period); s.notes = []; } });
  };
  reset();
  const ok = v => Promise.resolve(clone(v));
  const stamp = () => new Date().toISOString();
  const audit = (actor, action, entity, detail) => { D.audit.unshift({ id: 'L' + nextId++, at: stamp(), actor, action, entity, detail, session: true }); };
  const scope = pid => (!pid || pid === 'all') ? D.assets : D.assets.filter(a => a.portfolio === pid);
  const fail = msg => Promise.reject(new Error(msg));

  const Store = {
    reset: () => { reset(); return ok(true); },
    getConfig: () => ok(D.config),
    setConfig: patch => { // sample configuration only; no FX conversion is performed
      const allowed = ['currency', 'locale', 'targetYield']; allowed.forEach(k => { if (patch[k] !== undefined) D.config[k] = patch[k]; });
      return ok(D.config);
    },
    getPeriods: () => ok(D.periods.map(p => ({ id: p.id, label: p.label, prior: p.prior, months: p.months.length }))),
    getPortfolios: () => ok(D.portfolios),
    getAssets: (f = {}, periodId = '2026-Q3') => {
      const ex = C.exceptions(D, periodId);
      let list = scope(f.portfolio).filter(a => (!f.type || a.type === f.type) && (!f.status || a.status === f.status) &&
        (!f.q || (a.name + ' ' + a.location + ' ' + a.type).toLowerCase().includes(f.q.toLowerCase())) && (!f.exceptionsOnly || ex.some(e => e.assetId === a.id)));
      return ok(list.map(a => ({ ...a, period: C.assetPeriod(D, a, periodId), exceptionCount: ex.filter(e => e.assetId === a.id).length })));
    },
    getAsset: (id, periodId = '2026-Q3') => {
      const a = D.assets.find(x => x.id === id); if (!a) return fail('Asset not found');
      return ok({ asset: a, period: C.assetPeriod(D, a, periodId), prior: C.period(D, periodId).prior ? C.assetPeriod(D, a, C.period(D, periodId).prior) : null,
        portfolio: D.portfolios.find(p => p.id === a.portfolio), leases: D.leases.filter(l => l.assetId === id), documents: D.documents.filter(d => d.scope === 'asset' && d.ref === id),
        tasks: D.tasks.filter(t => t.assetId === id), exceptions: C.exceptions(D, periodId).filter(e => e.assetId === id), history: D.audit.filter(l => l.entity === id),
        periodMonths: C.period(D, periodId).months, monthly: D.months.map(m => C.assetMonth(D, a, m)), owners: D.investors.filter(i => i.holdings[id]).map(i => ({ id: i.id, name: i.name, share: i.holdings[id] })) });
    },
    getSummary: (pid, periodId) => { const as = scope(pid), p = C.period(D, periodId); return ok({ current: C.portfolioPeriod(D, as, periodId), vsPrior: C.vsPrior(D, as, periodId), prior: p.prior ? C.portfolioPeriod(D, as, p.prior) : null,
      series: C.monthlyNoiSeries(D, as), targetMonthlyNoi: as.reduce((s, a) => s + a.cost * C.targetFor(D, a) / 12, 0), periodMonths: p.months, statusCounts: as.reduce((m, a) => (m[a.status] = (m[a.status] || 0) + 1, m), {}),
      oldestValuation: as.filter(a => a.valuation).map(a => a.valuation.date).sort()[0] || null }); },
    getExceptions: (periodId, pid) => { const ids = new Set(scope(pid).map(a => a.id)); return ok(C.exceptions(D, periodId).filter(e => ids.has(e.assetId))); },
    getFacets: () => ok({ types: [...new Set(D.assets.map(a => a.type))].sort(), statuses: [...new Set(D.assets.map(a => a.status))].sort() }),
    getDocuments: (f = {}) => ok(D.documents.filter(d => (!f.status || d.status === f.status) && (!f.scope || d.scope === f.scope))),
    getTasks: (f = {}) => ok(D.tasks.filter(t => !f.status || t.status === f.status)),
    getAudit: (f = {}) => ok(D.audit.filter(l => !f.entity || l.entity === f.entity).sort((a, b) => b.at.localeCompare(a.at))),
    getAuditSince: iso => ok(D.audit.filter(l => l.at >= iso).sort((a, b) => b.at.localeCompare(a.at))),
    getInvestors: () => ok(D.investors.map(i => ({ ...i, statements: D.statements.filter(s => s.investorId === i.id) }))),
    // Internal (operator) view of every investor's pro-rata share for a period, with statement status.
    getInvestorSummaries: periodId => ok(D.investors.map(i => ({ ...i, statements: D.statements.filter(s => s.investorId === i.id).map(({ snapshot, ...s }) => s), snap: C.investorPeriod(D, i, periodId) }))),
    getStatements: () => ok(D.statements),
    getAllForAssistant: () => ok({ assets: D.assets, config: D.config }),

    toggleTask: (id, role) => { const t = D.tasks.find(x => x.id === id); if (!t) return fail('Task not found');
      t.status = t.status === 'Done' ? 'Open' : 'Done'; audit(role + ' (demo role)', t.status === 'Done' ? 'Task completed' : 'Task reopened', t.assetId, t.title); return ok(t); },

      if (role !== 'Approver') return fail('Only the Approver demo role can review documents (visual demonstration; a real system must enforce this on the server).');
      if (d.status !== 'Pending review') return fail('Document is not pending review');
      d.status = decision === 'approve' ? 'Approved' : 'Rejected'; audit('Approver (demo role)', decision === 'approve' ? 'Document approved' : 'Document rejected', d.ref, d.name); return ok(d); },

    // Investor statements: Draft -> In review -> Published, with maker/checker and an audit entry at each step.
    prepareStatement: (investorId, periodId, role) => {
      const inv = D.investors.find(i => i.id === investorId); if (!inv) return fail('Investor not found');
      let s = D.statements.find(x => x.investorId === investorId && x.period === periodId);
      if (s && s.status === 'Published') return fail('A statement for this investor and period is already published.');
      const snap = C.investorPeriod(D, inv, periodId), notes = [];
      snap.missingValuation.forEach(n => notes.push(`No valuation on file for ${n}; its value share is excluded.`));
      inv.holdings && Object.keys(inv.holdings).forEach(id => C.exceptions(D, periodId).filter(e => e.assetId === id && (e.type === 'Stale data')).forEach(e => notes.push(e.title + '.')));
      if (!s) { s = { id: 'S' + nextId++, investorId, period: periodId, status: 'Draft', preparedBy: role, approvedBy: null }; D.statements.push(s); }
      s.snapshot = snap; s.notes = notes; s.status = 'Draft'; s.preparedBy = role; s.reviewed = false;
      audit(role + ' (demo role)', 'Statement drafted', investorId, `${periodId} statement generated from sample data`); return ok(s);
    },
    submitStatement: (id, role, acknowledged) => { const s = D.statements.find(x => x.id === id); if (!s || s.status !== 'Draft') return fail('Only a draft can be submitted');
      if (!acknowledged) return fail('Confirm that you have reviewed the data notes before submitting.');
      s.status = 'In review'; s.reviewed = true; audit(role + ' (demo role)', 'Statement submitted for review', s.investorId, `${s.period} statement`); return ok(s); },
    decideStatement: (id, decision, role) => { const s = D.statements.find(x => x.id === id); if (!s || s.status !== 'In review') return fail('Statement is not in review');
      if (role !== 'Approver') return fail('Only the Approver demo role can decide (visual demonstration; real enforcement must be server-side).');
      if (s.preparedBy === role) return fail('Maker/checker rule: the person who prepared a statement cannot approve it. Switch the demo role to Analyst to prepare, then Approver to approve.');
      if (decision === 'approve') { s.status = 'Published'; s.approvedBy = role; audit('Approver (demo role)', 'Statement approved', s.investorId, `${s.period} statement approved and published to the investor view`); }
      else { s.status = 'Draft'; audit('Approver (demo role)', 'Statement returned', s.investorId, `${s.period} statement returned to draft`); }
      return ok(s); },

    // Visual demonstration of role-appropriate visibility. NOT a security boundary.
    getInvestorWorkspace: (investorId) => {
      const inv = D.investors.find(i => i.id === investorId); if (!inv) return fail('Investor not found');
      const order = id => D.periods.findIndex(p => p.id === id);
      const mine = D.statements.filter(s => s.investorId === investorId && s.status === 'Published').sort((x, y) => order(x.period) - order(y.period));
      // Only approved (published) statement snapshots are exposed: no live figures for unapproved periods.
      return ok({ investor: { id: inv.id, name: inv.name, type: inv.type },
        statements: mine.map(s => ({ id: s.id, period: s.period, periodLabel: C.period(D, s.period).label, status: s.status, snapshot: s.snapshot, notes: s.notes || [] })),
        documents: D.documents.filter(d => d.scope === 'investor' && d.ref === investorId && d.visibility === 'investor' && d.status === 'Approved'),
        communications: D.communications.filter(c => c.investorId === investorId && !c.internal).sort((x, y) => y.at.localeCompare(x.at)),
        holdings: Object.entries(inv.holdings).map(([id, share]) => { const a = D.assets.find(x => x.id === id); return { id, name: a.name, type: a.type, location: a.location, share }; }) });
    },
  };

  // ── Connected mode ─────────────────────────────────────────────────────────────────────────────
  // Auto-detected in init(). From file:// (or any host without the Observer API) nothing above changes and no request is made.
  // When served by Observer and signed in, data comes from /api/portfolio/*, every write goes through the server (which
  // enforces roles, maker/checker, investor isolation and the audit trail), and the browser keeps only a read copy.
  let mode = 'standalone', session = null;
  const standalone = {};
  ['setConfig', 'toggleTask', 'reviewDocument', 'prepareStatement', 'submitStatement', 'decideStatement', 'reset', 'getInvestorWorkspace'].forEach(k => { standalone[k] = Store[k]; });
  const call = async (method, path, body) => {
    const r = await fetch(path, { method, credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed (' + r.status + ')'), { status: r.status });
    return j;
  };
  const refresh = async () => { const b = await call('GET', '/api/portfolio/bootstrap'); if (b.empty) return b; const { empty, me, ...data } = b; D = data; return b; };
  const connected = () => mode === 'connected';

  Store.getMode = () => ({ mode, me: session });
  Store.useStandalone = () => { mode = 'standalone'; session = null; };
  Store.init = async () => {
    if (!/^https?:$/.test(root.location.protocol)) return { mode };
    let r; try { r = await fetch('/api/auth/me', { credentials: 'same-origin' }); } catch { return { mode }; }
    if (r.status === 401) { mode = 'signin'; return { mode }; }
    if (!r.ok || !/json/.test(r.headers.get('content-type') || '')) return { mode };
    session = await r.json();
    if (session.role === 'investor') { mode = 'investor'; return { mode, me: session }; }
    const b = await refresh(); session = { ...session, label: b.me.label };
    mode = b.empty ? 'connected-empty' : 'connected';
    return { mode, me: session };
  };
  // Re-read the agency's data so changes made by other users are visible. Called on every navigation in connected mode.
  Store.sync = async () => { if (connected()) await refresh(); };
  Store.loadSample = async () => { await call('POST', '/api/portfolio/seed'); const b = await refresh(); mode = 'connected'; return b; };
  Store.signOut = async () => { try { await call('POST', '/api/auth/logout', {}); } finally { root.location.href = '/login.html?next=/demo/index.html'; } };

  Store.setConfig = async patch => { if (!connected()) return standalone.setConfig(patch); await call('PATCH', '/api/portfolio/config', patch); await refresh(); return clone(D.config); };
  Store.toggleTask = async (id, role) => { if (!connected()) return standalone.toggleTask(id, role); const t = await call('POST', `/api/portfolio/tasks/${encodeURIComponent(id)}/toggle`); await refresh(); return t; };
  Store.reviewDocument = async (id, decision, role) => { if (!connected()) return standalone.reviewDocument(id, decision, role); const d = await call('POST', `/api/portfolio/documents/${encodeURIComponent(id)}/review`, { decision }); await refresh(); return d; };
  Store.prepareStatement = async (investorId, periodId, role) => {
    if (!connected()) return standalone.prepareStatement(investorId, periodId, role);
    const { id } = await call('POST', '/api/portfolio/statements', { investorId, period: periodId }); await refresh(); return clone(D.statements.find(x => x.id === id));
  };
  Store.submitStatement = async (id, role, ack) => { if (!connected()) return standalone.submitStatement(id, role, ack); await call('POST', `/api/portfolio/statements/${encodeURIComponent(id)}/submit`, { acknowledged: !!ack }); await refresh(); return clone(D.statements.find(x => x.id === id)); };
  Store.decideStatement = async (id, decision, role) => { if (!connected()) return standalone.decideStatement(id, decision, role); await call('POST', `/api/portfolio/statements/${encodeURIComponent(id)}/decide`, { decision }); await refresh(); return clone(D.statements.find(x => x.id === id)); };
  Store.reset = () => connected() ? fail('Reset is only available in standalone mode. In connected mode the data lives in the Observer database.') : standalone.reset();
  Store.getInvestorWorkspace = async investorId => {
    if (mode === 'investor') return call('GET', '/api/portfolio/investor-view');
    if (connected()) return call('GET', '/api/portfolio/investor-view?investorId=' + encodeURIComponent(investorId)); // server-built preview of exactly what that investor receives
    return standalone.getInvestorWorkspace(investorId);
  };
  // Only meaningful when connected (the standalone sample is fixed).
  Store.createAsset = async payload => { if (!connected()) return fail('Creating assets needs connected mode (the standalone sample is read-only).'); const r = await call('POST', '/api/portfolio/assets', payload); await refresh(); return r; };
  Store.recordValuation = async (id, payload) => { if (!connected()) return fail('Recording valuations needs connected mode.'); const r = await call('POST', `/api/portfolio/assets/${encodeURIComponent(id)}/valuation`, payload); await refresh(); return r; };
  Store.getPortfolioList = () => ok(D.portfolios);

  root.DemoStore = Store;
})(window);

</script>
<script>
/* SIMULATED assistant: deterministic, rule-based answers over the sample records. There is no AI model, no network call and
   no learning. Every answer lists the records it used, separates facts from rule-based inferences, names gaps, and refuses
   advice/forecasts. To use a real model, replace answer() with a server call; the UI contract (summary/sources/gaps) can stay. */
(function (root) {
  const S = root.DemoStore, C = root.DemoCalc;
  const pct = x => (x * 100).toFixed(2) + '%';
  const num = n => Math.round(n).toLocaleString('en-US');
  const REFUSE = /(should i|should we|recommend|invest in|buy|sell|worth buying|forecast|predict|projection|will (it|the|this)|expected return|guarantee|best asset|tax advice|legal advice)/i;

  async function answer(q, ctx) {
    const text = String(q || '').trim(), low = text.toLowerCase(), periodId = ctx.periodId;
    const { assets } = await S.getAllForAssistant();
    const out = { question: text, summary: [], sources: [], gaps: [], refused: false };
    const fact = t => out.summary.push({ type: 'fact', text: t }), infer = t => out.summary.push({ type: 'inference', text: t });
    const src = (label, href) => { if (!out.sources.some(s => s.label === label)) out.sources.push({ label, href }); };
    if (!text) { out.summary.push({ type: 'fact', text: 'Ask a question or pick a suggestion.' }); return out; }
    if (REFUSE.test(low)) {
      out.refused = true;
      fact('I cannot give investment, valuation, tax or legal advice, forecasts, or recommendations to buy or sell. This demo only describes the sample records.');
      infer('Try: "Which assets are below target?", "What needs attention?", or "What changed since last period?"');
      return out;
    }
    const words = low.split(/\W+/);
    const named = assets.find(a => low.includes(a.name.toLowerCase()) || words.includes(a.name.split(' ')[0].toLowerCase()));
    const exs = await S.getExceptions(periodId, 'all');
    if (named) {
      const d = await S.getAsset(named.id, periodId), p = d.period, a = d.asset;
      fact(`${a.name} (${a.type}, ${a.location}, status ${a.status}). Period ${periodId}: income ${num(p.income)}, operating costs ${num(p.opex)}, NOI ${num(p.noi)} ${ctx.currency}.`);
      fact(`Occupancy averaged ${(p.occupancy * 100).toFixed(1)}%. Yield on cost ${pct(p.yieldOnCost)} against a target of ${pct(p.target)} (annualised).`);
      a.valuation ? fact(`Valuation ${num(a.valuation.value)} dated ${a.valuation.date}, source: ${a.valuation.source}.`) : out.gaps.push('No valuation on file, so yield on value and value share cannot be shown.');
      if (p.target - p.yieldOnCost > 0) infer(`Yield on cost is ${((p.target - p.yieldOnCost) * 100).toFixed(2)} percentage points below the configured target (rule-based comparison, not a judgement of cause).`);
      d.exceptions.forEach(e => { fact(`Open item: ${e.title}.`); });
      d.tasks.filter(t => t.status === 'Open').forEach(t => fact(`Task: ${t.title} (owner ${t.owner}, due ${t.due}).`));
      src(`Asset record ${a.id}`, `#/assets/${a.id}`); src(`Financials ${periodId}`, `#/assets/${a.id}?tab=financials`); src('Exceptions and tasks', `#/assets/${a.id}?tab=tasks`);
    } else if (/(attention|exception|issue|risk|problem|review|urgent|overdue)/.test(low)) {
      const top = exs.slice(0, 6);
      fact(`${exs.length} open items under the current rules for ${periodId}; the ${top.length} highest-severity are listed.`);
      top.forEach(e => fact(`[${e.severity}] ${e.title}. Rule: ${e.rule}.`));
      infer('Ordering is by fixed severity rules (high, medium, low), not by financial impact.');
      src('Overview: needs attention', '#/overview'); src('Records: tasks', '#/records?tab=tasks');
    } else if (/(below|target|underperform|lagging|under target|behind)/.test(low)) {
      const rows = (await S.getAssets({}, periodId)).map(a => ({ a, p: a.period })).filter(r => r.p.yieldOnCost < r.p.target);
      fact(`${rows.length} of ${assets.length} assets have a yield on cost below their target for ${periodId}.`);
      rows.sort((x, y) => (x.p.yieldOnCost - x.p.target) - (y.p.yieldOnCost - y.p.target)).forEach(r => fact(`${r.a.name}: ${pct(r.p.yieldOnCost)} vs ${pct(r.p.target)} target.`));
      infer('The target is a sample setting you can change in Settings. Assets in lease-up or refurbishment are expected to sit below a stabilised target; the rules do not account for that.');
      src('Performance', '#/performance');
    } else if (/(change|changed|since|last period|prior|previous|vs |compare|movement)/.test(low)) {
      const v = (await S.getSummary('all', periodId)).vsPrior;
      if (!v) out.gaps.push(`No comparable prior period exists in the sample data for ${periodId}.`);
      else {
        fact(`Versus ${v.prior}: NOI ${v.noiDelta >= 0 ? 'up' : 'down'} ${num(Math.abs(v.noiDelta))} ${ctx.currency}${v.noiPct == null ? '' : ' (' + (v.noiPct * 100).toFixed(1) + '%)'}, income ${v.incomeDelta >= 0 ? '+' : '-'}${num(Math.abs(v.incomeDelta))}, operating costs ${v.opexDelta >= 0 ? '+' : '-'}${num(Math.abs(v.opexDelta))}, occupancy ${(v.occDelta * 100 >= 0 ? '+' : '') + (v.occDelta * 100).toFixed(1)} points.`);
        const rec = await S.getAuditSince('2026-09-01T00:00:00Z'); rec.slice(0, 4).forEach(l => fact(`Record change ${l.at.slice(0, 10)}: ${l.action} (${l.entity}) ${l.detail}.`));
        infer('The sample data does not say why figures moved; causes would need to come from operator commentary.');
      }
      src('Overview: changes', '#/overview'); src('Audit history', '#/records?tab=audit');
    } else if (/(missing|stale|fresh|data quality|gap|outdated|valuation|document|record)/.test(low)) {
      const gaps = exs.filter(e => e.type === 'Missing data' || e.type === 'Stale data' || e.type === 'Record');
      gaps.forEach(e => fact(`${e.type}: ${e.title}. ${e.detail}`));
      if (!gaps.length) fact('No missing or stale records under the current rules.');
      fact(`Financials in the sample are closed through ${ctx.cfg.dataThrough}; source: ${ctx.cfg.financialsSource}. Demo reference date: ${ctx.cfg.demoToday}.`);
      src('Records: documents', '#/records?tab=documents'); src('Assets', '#/assets');
    } else if (/(investor|statement|report to|publish)/.test(low)) {
      const inv = await S.getInvestors();
      inv.forEach(i => fact(`${i.name}: ${i.statements.map(s => `${s.period} ${s.status}`).join(', ') || 'no statements'}.`));
      infer('A Q3 2026 statement can be drafted under Investors; publishing requires a second (Approver) demo role.');
      src('Investors', '#/investors');
    } else {
      out.gaps.push('I can only answer from the sample records in this demo and did not recognise the question.');
      infer('Try asking about attention items, assets below target, changes since the last period, missing or stale data, an asset by name, or investor statements.');
    }
    return out;
  }
  root.DemoAssistant = { answer, suggestions: ['What needs attention?', 'Which assets are below target?', 'What changed since last period?', 'Which data is missing or stale?', 'Summarise Northgate Office Park', 'What is the status of investor statements?'] };
})(window);

</script>

<script>
/* Portfolio & Investor Operations: concept prototype UI. Vanilla JS, no dependencies, no network.
   All data arrives through DemoStore (replaceable boundary); all numbers come from DemoCalc. */
(function () {
  const Store = window.DemoStore, Calc = window.DemoCalc, I = window.DemoI18n, Asst = window.DemoAssistant;
  const t = I.t;
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);
  const S = { periodId: '2026-Q3', portfolio: 'all', role: 'Analyst', theme: 'system', cfg: null, periods: [], portfolios: [], filter: { q: '', type: '', status: '', exceptionsOnly: false }, answers: [], docFilter: '', mode: 'standalone', me: null };

  // ── formatting (driven by configuration, never hard-coded to a region) ──
  const money = (n, compact) => n == null ? '—' : new Intl.NumberFormat(S.cfg.locale, { style: 'currency', currency: S.cfg.currency, maximumFractionDigits: compact ? 2 : 0, notation: compact ? 'compact' : 'standard' }).format(n);
  const num = n => new Intl.NumberFormat(S.cfg.locale, { maximumFractionDigits: 0 }).format(n);
  const pct = (x, dp = 1) => x == null ? '—' : new Intl.NumberFormat(S.cfg.locale, { style: 'percent', minimumFractionDigits: dp, maximumFractionDigits: dp }).format(x);
  const pp = x => (x >= 0 ? '+' : '−') + new Intl.NumberFormat(S.cfg.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(x * 100)) + ' pp';
  const date = iso => iso ? new Intl.DateTimeFormat(S.cfg.locale, { dateStyle: 'medium', timeZone: 'UTC' }).format(new Date(iso.length === 10 ? iso + 'T00:00:00Z' : iso)) : '—';
  const monthLabel = m => new Intl.DateTimeFormat(S.cfg.locale, { month: 'short', year: '2-digit', timeZone: 'UTC' }).format(new Date(m + '-01T00:00:00Z'));
  const signed = n => (n >= 0 ? '+' : '−') + money(Math.abs(n));
  const periodLabel = id => (S.periods.find(p => p.id === id) || {}).label || id;

  const pill = (text, kind) => `<span class="pill ${kind}">${esc(text)}</span>`;
  const statusKind = s => ({ Approved: 'good', Published: 'good', 'Pending review': 'warn', 'In review': 'info', Draft: 'neutral', Missing: 'bad', Expired: 'bad', Rejected: 'bad', Done: 'good', Open: 'warn' }[s] || 'neutral');
  const sevKind = s => ({ high: 'bad', medium: 'warn', low: 'neutral' }[s]);
  const sample = () => `<span class="tag-sample">${esc(t('sample data'))}</span>`;
  const targetPill = (y, target) => {
    const d = y - target, short = S.cfg.thresholds.yieldShortfall;
    return d >= 0 ? pill(t('At or above target'), 'good') : d > -short ? pill(t('Slightly below target'), 'warn') : pill(t('Below target'), 'bad');
  };
  // Arrow shows the direction of the change; colour shows whether it is good (green) or bad (red). For costs, lower is good.
  const delta = (d, fmt, lowerIsGood) => d == null ? `<span class="delta flat">${esc(t('no prior period in sample'))}</span>` : `<span class="delta ${d === 0 ? 'flat' : (d > 0) !== !!lowerIsGood ? 'up' : 'down'}">${d > 0 ? '▲' : d < 0 ? '▼' : '■'} ${esc(fmt(d))}</span>`;

  };
  const toast = (msg, bad) => { const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg; $('toast-host').replaceChildren(el); setTimeout(() => el.remove(), 4500); };

  const periodSelect = () => `<label class="ctrl">${esc(t('Reporting period'))}<select data-bind="period">${S.periods.map(p => `<option value="${esc(p.id)}"${p.id === S.periodId ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}</select></label>`;

  const head = (title, sub, ctrls = '') => `<div class="top"><div><h1>${esc(title)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div><div class="ctrls">${ctrls}</div></div>`;
  const assumptions = () => `${esc(t('Currency'))}: ${esc(S.cfg.currency)} (${esc(t('sample configuration, no FX conversion'))}) · ${esc(t('Source'))}: ${esc(S.cfg.financialsSource)} · ${esc(t('Closed through'))} ${esc(date(S.cfg.dataThrough))}`;
  const empty = msg => `<div class="empty">${esc(msg)}</div>`;

  function barChart(series, selected, targetLine) {
    const W = 640, H = 230, pad = { l: 52, r: 8, t: 14, b: 30 }, max = Math.max(...series.map(s => s.noi), targetLine) * 1.12, bw = (W - pad.l - pad.r) / series.length;
    const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
    const grid = [0, .5, 1].map(f => { const val = max / 1.12 * f, yy = y(val).toFixed(1); return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="0" y="${(+yy + 4)}">${esc(money(val, true))}</text>`; }).join('');
    const bars = series.map((s, i) => { const x = pad.l + i * bw + bw * .16, w = bw * .68, sel = selected.includes(s.month);
      return `<g><title>${esc(monthLabel(s.month))}: ${esc(money(s.noi))}</title><rect x="${x.toFixed(1)}" y="${y(s.noi).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - pad.b - y(s.noi)).toFixed(1)}" rx="3" fill="var(--accent)" opacity="${sel ? 1 : .38}"/><text x="${(x + w / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(monthLabel(s.month))}</text></g>`; }).join('');
    const ty = y(targetLine).toFixed(1);
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('Monthly net operating income'))}: ${esc(money(series[0].noi))} → ${esc(money(series[series.length - 1].noi))}. ${esc(t('Dashed line is the target-yield monthly NOI.'))}">${grid}${bars}<line x1="${pad.l}" x2="${W - pad.r}" y1="${ty}" y2="${ty}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W - pad.r}" y="${(ty - 5)}" text-anchor="end" style="fill:var(--warn);font-weight:600">${esc(t('Target'))} ${esc(money(targetLine, true))}</text></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>${esc(t('Selected period'))}</span><span><i style="background:var(--accent);opacity:.38"></i>${esc(t('Other months'))}</span><span><i style="background:var(--warn)"></i>${esc(t('Target-yield monthly NOI'))}</span></div></div>
      <details class="method" style="margin-top:10px"><summary>${esc(t('Chart data (table)'))}</summary><div class="tblwrap"><table><thead><tr><th>${esc(t('Month'))}</th><th class="num">${esc(t('Income'))}</th><th class="num">NOI</th></tr></thead><tbody>${series.map(s => `<tr><td>${esc(monthLabel(s.month))}</td><td class="num">${esc(money(s.income))}</td><td class="num">${esc(money(s.noi))}</td></tr>`).join('')}</tbody></table></div></details>`;
  }

  function csvDownload(name, rows) {
    const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ── views ──

      `<div class="grid kpis">

        ${kpi(t('Portfolio value'), esc(money(c.value, true)), `${esc(t('From'))} ${c.valuedCount} ${esc(t('of'))} ${c.assetCount} ${esc(t('assets with a valuation on file'))}${sum.oldestValuation ? `; ${esc(t('oldest dated'))} ${esc(date(sum.oldestValuation))}` : ''}. ${esc(t('Mixed valuation dates and sources.'))}`)}
        ${kpi(t('Income'), esc(money(c.income, true)), delta(v && v.incomeDelta, signed) + (v ? ` ${esc(t('vs'))} ${esc(periodLabel(v.prior))}` : ''))}
        ${kpi(t('Operating costs'), esc(money(c.opex, true)), delta(v && v.opexDelta, signed, true) + (v ? ` ${esc(t('vs'))} ${esc(periodLabel(v.prior))}` : ''))}
        ${kpi(t('Net operating income'), esc(money(c.noi, true)), delta(v && v.noiDelta, signed) + (v ? ` ${esc(t('vs'))} ${esc(periodLabel(v.prior))}` : ''))}
        ${kpi(t('NOI yield on cost (annualised)'), esc(pct(yc, 2)), `${esc(t('Target'))} ${esc(pct(avgTarget, 2))} · ${targetPill(yc, avgTarget)}`)}
        ${kpi(t('Occupancy (rent-weighted)'), esc(pct(c.occupancy)), delta(v && v.occDelta, d => pp(d)) + (v ? ` ${esc(t('vs'))} ${esc(periodLabel(v.prior))}` : ''))}

        <section class="card"><header><h2>${esc(t('Data freshness and coverage'))}</h2></header>
          <dl class="dl"><dt>${esc(t('Reporting period'))}</dt><dd>${esc(periodLabel(S.periodId))}</dd><dt>${esc(t('Financials closed through'))}</dt><dd>${esc(date(S.cfg.dataThrough))}</dd><dt>${esc(t('Financial source'))}</dt><dd>${esc(S.cfg.financialsSource)}</dd><dt>${esc(t('Demo reference date'))}</dt><dd>${esc(date(S.cfg.demoToday))} <span class="muted small">(${esc(t('fixed, not today'))})</span></dd><dt>${esc(t('Valuation coverage'))}</dt><dd>${c.valuedCount}/${c.assetCount}</dd><dt>${esc(t('Connections'))}</dt><dd>${pill(t('Not connected'), 'neutral')} <span class="muted small">${esc(t('ledger, valuations, documents, identity'))}</span></dd></dl></section>
      </div>
      <div class="grid cols2e" style="margin-top:14px">
        <section class="card"><header><h2>${esc(t('Needs attention'))} (${ex.length})</h2><a href="#/records?tab=tasks">${esc(t('Open records'))}</a></header>
          ${ex.length ? `<ul class="list">${ex.slice(0, 6).map(e => `<li><div><div class="t"><a href="#/assets/${esc(e.assetId)}?tab=tasks">${esc(e.title)}</a></div><div class="d">${esc(e.detail)} <span class="mono">${esc(t('Rule'))}: ${esc(e.rule)}</span></div></div><div>${pill(t(e.severity), sevKind(e.severity))}</div></li>`).join('')}</ul>` : empty(t('No open items under the current rules.'))}</section>

  async function openStatement(investorId) {

    if (!s) { s = await Store.prepareStatement(investorId, S.periodId, S.role); toast(t('Draft generated from sample data.')); await render(); const fresh = (await Store.getInvestors()).find(i => i.id === investorId); s = fresh.statements.find(x => x.period === S.periodId); }

        <p class="small muted">${esc(t('Relabels the unit only. The sample values are not converted between currencies.'))}</p>
        <label class="ctrl">${esc(t('Number and date format'))}<select data-bind="locale"${lock}>${loc.map(([v, l]) => `<option value="${v}"${v === S.cfg.locale ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
        <label class="ctrl">${esc(t('Target NOI yield on cost (%)'))}<input type="number" step="0.1" min="0" max="30" value="${(S.cfg.targetYield * 100).toFixed(1)}" data-bind="target"${lock}></label>
        ${conn ? `<p class="small muted">${esc(lock ? t('Only an Approver can change these; they apply to the whole agency.') : t('These settings are saved for the whole agency.'))}</p>` : ''}
        <label class="ctrl">${esc(t('Theme'))}<select data-bind="theme"><option value="system"${S.theme === 'system' ? ' selected' : ''}>${esc(t('System'))}</option><option value="light"${S.theme === 'light' ? ' selected' : ''}>${esc(t('Light'))}</option><option value="dark"${S.theme === 'dark' ? ' selected' : ''}>${esc(t('Dark'))}</option></select></label>
        <div class="seg" role="group" aria-label="${esc(t('Language'))}"><button data-act="lang" data-l="en" aria-pressed="${I.lang === 'en'}">English</button><button data-act="lang" data-l="ar" aria-pressed="${I.lang === 'ar'}">العربية</button></div>
        <p class="small muted">${esc(t('Arabic covers interface text. Sample record names, assistant answers and exception sentences remain in English.'))}</p></div></section>
        <section class="card"><header><h2>${esc(t('Data connections'))}</h2></header><ul class="list">${[...(conn ? [['Observer backend', 'Agency database, roles and audit enforced by the server']] : []), ['General ledger / accounting', conn ? 'Sample data stored in the database' : 'Sample extract in the page'], ['Valuation provider', 'Sample records'], ['Document store', 'Sample records, no files'], ['Identity and permissions', 'Visual demo roles only'], ['Lead engagement (voice) module', 'Separate scripted simulation']].map(([n, d]) => `<li><div><div class="t">${esc(t(n))}</div><div class="d">${esc(t(d))}</div></div>${n === 'Observer backend' ? pill(t('Connected'), 'good') : pill(t('Not connected'), 'neutral')}</li>`).join('')}</ul>
        ${conn ? '' : `<div style="margin-top:12px"><button class="btn" data-act="reset">${esc(t('Reset demo data'))}</button> <span class="small muted">${esc(t('Clears this session’s changes.'))}</span></div>`}</section></div>
      <details class="method" style="margin-top:14px"><summary>${esc(t('About this prototype'))}</summary><p class="small" style="margin-top:8px">${esc(t('Concept prototype with fictional data. Not a production platform and not connected to any real system. What is simulated, what is missing and what a production build needs is documented in IMPLEMENTATION_NOTES.md.'))}</p></details>`;
  }

  // ── shell ──
  function renderShell(r) {
    const inv = r.route === 'investor', invOnly = S.mode === 'investor', conn = S.mode === 'connected' || S.mode === 'connected-empty';
    document.body.classList.toggle('investor-mode', inv);
    $('skip').textContent = t('Skip to content');
    $('banner').innerHTML = invOnly
      ? `<strong>${esc(t('Investor access'))}</strong><span>${esc(t('You can see only your own approved statements and documents. This is enforced by the server. Fictional sample data.'))}</span><a href="#" data-act="signout">${esc(t('Sign out'))}</a>`
      : conn
        ? `<strong>${esc(t('Concept prototype — sample data'))}</strong><span>${esc(t('Connected mode: fictional sample data stored in your agency’s Observer database. Roles and investor access are enforced by the server.'))}</span><a href="voice-simulation.html">${esc(t('Lead engagement module (optional, separate)'))}</a>`
        : `<strong>${esc(t('Concept prototype — sample data'))}</strong><span>${esc(t('Fictional assets, figures and people. Not connected to any production system. Nothing is saved.'))}</span><a href="voice-simulation.html">${esc(t('Lead engagement module (optional, separate)'))}</a>`;
    const nav = [['overview', 'Overview'], ['assets', 'Assets'], ['performance', 'Performance'], ['investors', 'Investors'], ['records', 'Records'], ['assistant', 'Assistant (simulated)'], ['settings', 'Settings']];
    const chip = invOnly ? `${esc(S.me.email)}` : conn ? `${esc(t('Connected'))}: ${esc(S.me.agency || '')}` : esc(t('Standalone sample (nothing saved)'));
    const account = invOnly ? '' : conn
      ? `<span class="small">${esc(S.me.email)} · <strong>${esc(t(S.role))}</strong></span><span class="small">${esc(t('Role enforced by the server.'))}</span><button class="btn small" data-act="signout" style="margin-top:6px">${esc(t('Sign out'))}</button>`
      : `<label class="ctrl">${esc(t('Demo role'))}<select data-bind="role"><option value="Analyst"${S.role === 'Analyst' ? ' selected' : ''}>${esc(t('Analyst'))}</option><option value="Approver"${S.role === 'Approver' ? ' selected' : ''}>${esc(t('Approver'))}</option></select></label><span class="small">${esc(t('Visual only: not enforced.'))}</span>`;
    $('side').innerHTML = `<div class="brand"><b>${esc(t('Portfolio & Investor Operations'))}</b><span>${esc(t('Concept prototype'))}</span><span class="small" style="display:block;margin-top:4px">${chip}</span></div>
      <nav class="nav" aria-label="${esc(t('Primary'))}">${invOnly ? `<a href="#/investor/${esc(S.me.investorId)}" aria-current="page">${esc(t('My portfolio'))}</a>` : inv ? `<a href="#/investor/${esc(r.id || '')}" aria-current="page">${esc(t('My portfolio'))}</a><a href="#/overview">${esc(t('Back to operator view'))}</a>` : (S.mode === 'signin' || S.mode === 'connected-empty') ? '' : nav.map(([k, l]) => `<a href="#/${k}"${k === r.route ? ' aria-current="page"' : ''}>${esc(t(l))}</a>`).join('')}</nav>
      <div class="sep"></div><div class="opt">${account}
      <div class="seg" style="margin-top:8px" role="group" aria-label="${esc(t('Language'))}"><button data-act="lang" data-l="en" aria-pressed="${I.lang === 'en'}">EN</button><button data-act="lang" data-l="ar" aria-pressed="${I.lang === 'ar'}">AR</button></div>
      ${invOnly ? '' : `<a href="voice-simulation.html">${esc(t('Lead engagement module (optional, separate)'))}</a>`}${conn ? `<a href="../platform.html">${esc(t('Open the lead workspace'))}</a>` : ''}</div>`;
  }

  let renderId = 0;
  async function render() {
    const my = ++renderId, r = parse(), main = $('main');
    if (S.mode === 'investor') { r.route = 'investor'; r.id = S.me.investorId; }
    renderShell(r);
    try {
      let html;
      if (S.mode === 'connected') { await Store.sync(); S.cfg = await Store.getConfig(); S.portfolios = await Store.getPortfolios(); }
      if (S.mode === 'signin') html = viewSignin();
      else if (S.mode === 'connected-empty') html = viewEmptyConnected();
      else if (r.route === 'overview') html = await viewOverview();
      else if (r.route === 'assets') html = r.id ? await viewAsset(r.id, r.q.tab) : await viewAssets();
      else if (r.route === 'performance') html = await viewPerformance();
      else if (r.route === 'investors') html = await viewInvestors();
      else if (r.route === 'investor') html = await viewInvestorWorkspace(r.id || 'INV-01');
      else if (r.route === 'records') html = await viewRecords(r.q.tab);
      else if (r.route === 'assistant') html = await viewAssistant();
      else if (r.route === 'settings') html = await viewSettings();
      else html = `<div class="empty">${esc(t('Page not found.'))} <a href="#/overview">${esc(t('Go to overview'))}</a></div>`;
      if (my !== renderId) return;
      main.innerHTML = html;
      document.title = `${t('Portfolio & Investor Operations')} — ${t('concept prototype')}`;
      if (r.route === 'assets' && !r.id) fillAssetTable();
      if (r.route === 'assets' && !r.id && S.focusSearch) { const q = $('f-q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } S.focusSearch = false; }
    } catch (e) {
      if (my !== renderId) return;
      main.innerHTML = `<div class="notice bad"><strong>${esc(t('Could not load this view.'))}</strong> ${esc(e.message)} <button class="btn small" data-act="retry">${esc(t('Retry'))}</button></div>`;
    }
  }

  function viewSignin() {
    return `<section class="card" style="max-width:640px"><h1>${esc(t('Portfolio & Investor Operations'))}</h1>
      <p style="margin:10px 0">${esc(t('This page is served by an Observer server. Sign in to use connected mode (data stored per agency, roles and investor access enforced by the server), or continue with the local sample (nothing saved).'))}</p>
      <p class="ctrls"><a class="btn primary" style="text-decoration:none;display:inline-block" href="/login.html?next=/demo/index.html">${esc(t('Sign in'))}</a><button class="btn" data-act="standalone">${esc(t('Continue with the local sample'))}</button></p></section>`;
  }
  function viewEmptyConnected() {
    const admin = S.me.role === 'admin';
    return `<section class="card" style="max-width:640px"><h1>${esc(t('No portfolio data yet'))}</h1>
      <p style="margin:10px 0">${esc(t('This agency has no portfolio records. Loading the sample adds the fictional demonstration portfolio to this agency’s database.'))}</p>
      ${admin ? `<button class="btn primary" data-act="load-sample">${esc(t('Load the sample portfolio'))}</button>` : `<div class="notice info">${esc(t('Ask an admin to load the sample portfolio.'))}</div>`}
      <p class="small muted" style="margin-top:10px"><button class="btn small" data-act="standalone">${esc(t('Use the local sample instead'))}</button></p></section>`;
  }

  function openAssetDialog() {
    const f = (id, label, input) => `<label class="ctrl" style="margin-bottom:8px">${esc(label)}${input}</label>`;
    openDialog(t('Add asset'), `<p class="small muted" style="margin-bottom:10px">${esc(t('Creates an asset with no valuation. Missing required records are flagged automatically.'))}</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px">
      ${f('n', t('Name'), '<input type="text" id="na-name" maxlength="120">')}${f('t', t('Type'), '<input type="text" id="na-type" maxlength="60" placeholder="Office">')}
      ${f('p', t('Portfolio'), `<select id="na-port">${S.portfolios.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`)}${f('l', t('Location'), '<input type="text" id="na-loc" maxlength="120">')}
      ${f('s', t('Status'), '<select id="na-status"><option>Stabilised</option><option>Lease-up</option><option>Refurbishment</option><option>Held for sale</option></select>')}${f('a', t('Acquired'), '<input type="date" id="na-acq">')}
      ${f('c', t('Acquisition cost'), '<input type="number" id="na-cost" min="1" step="1">')}${f('cap', t('Capacity'), '<input type="number" id="na-cap" min="0" step="1" value="0">')}
      ${f('u', t('Unit'), '<select id="na-unit"><option value="units">units</option><option value="sqm">sqm</option></select>')}${f('g', t('Gross potential rent per month'), '<input type="number" id="na-gpr" min="0" step="1" value="0">')}
      ${f('o', t('Other income per month'), '<input type="number" id="na-other" min="0" step="1" value="0">')}${f('m', t('Operating costs per month'), '<input type="number" id="na-opex" min="0" step="1" value="0">')}
      ${f('oc', t('Typical occupancy (%) applied to every month'), '<input type="number" id="na-occ" min="0" max="100" step="1" value="0">')}</div>`,
      [{ label: t('Create asset'), primary: true, onClick: async () => {
        const v = id => $(id).value, occ = Math.min(100, Math.max(0, Number(v('na-occ')) || 0)) / 100;
        await Store.createAsset({ name: v('na-name'), type: v('na-type'), portfolio: v('na-port'), location: v('na-loc'), status: v('na-status'), acquired: v('na-acq'), cost: Number(v('na-cost')), capacity: Number(v('na-cap')), unit: v('na-unit'), gpr: Number(v('na-gpr')), other: Number(v('na-other')), opex: { maintenance: Number(v('na-opex')) }, occupancy: Array(12).fill(occ) });
        dlg.close(); toast(t('Asset created and recorded in the audit history.')); await render();
      } }]);
  }
  function openValuationDialog(id) {
    openDialog(t('Record valuation'), `<p class="small muted" style="margin-bottom:10px">${esc(t('A valuation needs a value, an as-at date and a named source. It is recorded in the audit history.'))}</p>
      <label class="ctrl" style="margin-bottom:8px">${esc(t('Value'))}<input type="number" id="nv-val" min="1" step="1"></label><label class="ctrl" style="margin-bottom:8px">${esc(t('As at'))}<input type="date" id="nv-date"></label><label class="ctrl">${esc(t('Source'))}<input type="text" id="nv-src" maxlength="120" placeholder="Independent appraisal"></label>`,
      [{ label: t('Save valuation'), primary: true, onClick: async () => { await Store.recordValuation(id, { value: Number($('nv-val').value), date: $('nv-date').value, source: $('nv-src').value }); dlg.close(); toast(t('Valuation recorded.')); await render(); } }]);
  }

  // ── events ──
  document.addEventListener('change', async e => { try { await onChange(e); } catch (err) { toast(err.message, true); await render(); } });
  async function onChange(e) {
    const el = e.target, b = el.dataset && el.dataset.bind;
    if (el.id === 'f-type') { S.filter.type = el.value; return fillAssetTable(); }
    if (el.id === 'f-status') { S.filter.status = el.value; return fillAssetTable(); }
    if (el.id === 'f-ex') { S.filter.exceptionsOnly = el.checked; return fillAssetTable(); }
    if (!b) return;
    if (b === 'period') S.periodId = el.value;
    else if (b === 'portfolio') S.portfolio = el.value;
    else if (b === 'role') S.role = el.value;
    else if (b === 'docfilter') S.docFilter = el.value;
    else if (b === 'investor') { location.hash = '#/investor/' + el.value; return; }
    else if (b === 'currency') { S.cfg = await Store.setConfig({ currency: el.value }); }
    else if (b === 'locale') { S.cfg = await Store.setConfig({ locale: el.value }); }
    else if (b === 'target') { const v = parseFloat(el.value); if (isFinite(v) && v >= 0 && v <= 30) S.cfg = await Store.setConfig({ targetYield: v / 100 }); }
    else if (b === 'theme') { S.theme = el.value; if (el.value === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = el.value; }
    render();
  }
  document.addEventListener('input', e => { if (e.target.id === 'f-q') { S.filter.q = e.target.value; fillAssetTable(); } });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'ask-form') return; e.preventDefault(); await ask($('ask-q').value);
  });
  async function ask(q) {
    const ctx = { periodId: S.periodId, currency: S.cfg.currency, cfg: S.cfg };
    S.answers.unshift(await Asst.answer(q, ctx)); S.answers = S.answers.slice(0, 8);
    const box = $('answers'); if (box) box.innerHTML = S.answers.map(answerHtml).join(''); const inp = $('ask-q'); if (inp) { inp.value = ''; inp.focus(); }
  }
  document.addEventListener('click', async e => {
    const row = e.target.closest('tr[data-href]'); if (row && !e.target.closest('a,button')) { location.hash = row.dataset.href; return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    try {
      if (act === 'lang') { I.set(el.dataset.l); await render(); }
      else if (act === 'retry') await render();
      else if (act === 'signout') await Store.signOut();
      else if (act === 'standalone') { Store.useStandalone(); S.mode = 'standalone'; S.me = null; S.cfg = await Store.getConfig(); S.periods = await Store.getPeriods(); S.portfolios = await Store.getPortfolios(); location.hash = '#/overview'; await render(); }
      else if (act === 'load-sample') { await Store.loadSample(); S.mode = 'connected'; S.cfg = await Store.getConfig(); S.periods = await Store.getPeriods(); S.portfolios = await Store.getPortfolios(); toast(t('Sample portfolio loaded.')); location.hash = '#/overview'; await render(); }
      else if (act === 'add-asset') openAssetDialog();
      else if (act === 'valuation') openValuationDialog(el.dataset.id);
      else if (act === 'ask') await ask(el.dataset.q);
      else if (act === 'task') { await Store.toggleTask(el.dataset.id, S.role); toast(t('Task updated and recorded in the audit history.')); await render(); }
      else if (act === 'doc') { await Store.reviewDocument(el.dataset.id, el.dataset.d, S.role); toast(t('Document review recorded in the audit history.')); await render(); }
      else if (act === 'stmt-draft' || act === 'stmt-open') { if (el.dataset.period) S.periodId = el.dataset.period; await openStatement(el.dataset.id); }
      else if (act === 'inv-stmt') { const w = await Store.getInvestorWorkspace(el.dataset.inv), s = w.statements.find(x => x.id === el.dataset.id); openDialog(`${t('Statement')} — ${s.periodLabel}`, stmtTable(s.snapshot) + (s.notes.length ? `<div class="notice warn" style="margin-top:10px"><ul style="margin:0;padding-inline-start:18px">${s.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : '')); }
      else if (act === 'reset') { await Store.reset(); S.answers = []; toast(t('Demo data reset.')); await render(); }
      else if (act === 'csv-asset') { const d = await Store.getAsset(el.dataset.id, S.periodId); csvDownload(`${d.asset.id}-monthly-${S.cfg.currency}.csv`, [['Month', 'Occupancy', 'Rental income', 'Other income', 'Total income', 'Operating costs', 'NOI', 'Currency', 'Source'], ...d.monthly.map(m => [m.month, m.occ, m.rental, m.other, m.income, m.opex, m.noi, S.cfg.currency, S.cfg.financialsSource])]); }
      else if (act === 'csv-perf') { const as = await Store.getAssets({ portfolio: S.portfolio }, S.periodId); csvDownload(`performance-${S.periodId}-${S.cfg.currency}.csv`, [['Asset', 'Period', 'Income', 'Operating costs', 'NOI', 'Occupancy', 'Yield on cost', 'Yield on value', 'Target yield', 'Currency', 'Source'], ...as.map(a => [a.name, S.periodId, a.period.income, a.period.opex, a.period.noi, a.period.occupancy.toFixed(4), a.period.yieldOnCost.toFixed(4), a.period.yieldOnValue == null ? '' : a.period.yieldOnValue.toFixed(4), a.period.target, S.cfg.currency, S.cfg.financialsSource])]); }
    } catch (err) { toast(err.message, true); }
  });
  window.addEventListener('hashchange', () => { render(); $('main').focus({ preventScroll: true }); window.scrollTo(0, 0); });

  (async function init() {
    try {
      const st = await Store.init();
      S.mode = st.mode; S.me = st.me || null;
      if (S.mode === 'connected' || S.mode === 'connected-empty') S.role = S.me.label || (S.me.role === 'admin' ? 'Approver' : 'Analyst');
      if (S.mode === 'investor') S.cfg = { currency: 'USD', locale: 'en-US', thresholds: {} };
      else { S.cfg = await Store.getConfig(); S.periods = await Store.getPeriods(); S.portfolios = await Store.getPortfolios(); }
    } catch (e) { S.mode = 'standalone'; Store.useStandalone(); S.cfg = await Store.getConfig(); S.periods = await Store.getPeriods(); S.portfolios = await Store.getPortfolios(); }
    window.DemoI18n.register(window.DemoAR || {});
    if (!location.hash && S.mode !== 'investor') location.hash = '#/overview'; else render();
  })();
  window.DemoApp = { render };
})();

</script>
</body>
</html>
